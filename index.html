<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curly</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="brand">Curly</span>

      <input
        id="project-name"
        type="text"
        spellcheck="false"
        autocomplete="off"
        aria-label="Project name"
        data-i18n-aria="project.aria"
        data-i18n-tip="project.tip"
        data-tip="The name of this model. Exports and saved files are named after it."
      />

      <button type="button" id="file-open" data-i18n="toolbar.open" data-i18n-tip="toolbar.open.tip">Open</button>
      <button type="button" id="file-save" data-i18n="toolbar.save" data-i18n-tip="toolbar.save.tip">Save</button>
      <button type="button" id="load-example" data-i18n="toolbar.example" data-i18n-tip="toolbar.example.tip">
        Load example
      </button>

      <span class="spacer"></span>

      <button type="button" id="toggle-locale" data-tip="Switch the interface to Brazilian Portuguese">PT-BR</button>
      <button type="button" id="toggle-theme" data-tip="Switch between the light and dark theme">Theme</button>
      <button
        type="button"
        id="toggle-source"
        aria-pressed="false"
        data-i18n="toolbar.source"
        data-i18n-tip="toolbar.source.tip"
      >
        Source
      </button>
      <button type="button" id="export-schema" data-i18n="toolbar.schema" data-i18n-tip="toolbar.schema.tip">
        JSON Schema
      </button>
      <button type="button" id="export-validator" data-i18n="toolbar.validator" data-i18n-tip="toolbar.validator.tip">
        Mongo validator
      </button>
      <button type="button" id="export-png" data-i18n="toolbar.png" data-i18n-tip="toolbar.png.tip">PNG</button>
      <button type="button" id="export-samples" data-i18n="toolbar.samples" data-i18n-tip="toolbar.samples.tip">
        Samples
      </button>
    </header>

    <main id="workspace" class="source-hidden">
      <section id="source-pane">
        <div id="gutter" aria-hidden="true"><div id="gutter-lines"></div></div>
        <div id="code">
          <div id="line-band" aria-hidden="true"></div>
          <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea
            id="source"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            wrap="off"
            aria-label="Model source"
            data-i18n-aria="source.aria"
          ></textarea>
        </div>
      </section>

      <section id="diagram-pane">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
        <ul id="diagnostics"></ul>
      </section>
    </main>

    <script type="module" src="dist/app/main.js"></script>
  </body>
</html>
