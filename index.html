<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curly</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="brand">Curly</span>

      <input
        id="project-name"
        type="text"
        spellcheck="false"
        autocomplete="off"
        aria-label="Project name"
        data-tip="The name of this model. Exports and saved files are named after it."
      />

      <button type="button" id="file-open" data-tip="Open a .curly model from your computer">Open</button>
      <button type="button" id="file-save" data-tip="Save the model back to its file, or choose where to put it">
        Save
      </button>
      <button type="button" id="load-example" data-tip="Replace the model with one of the worked examples">
        Load example
      </button>

      <span class="spacer"></span>

      <button type="button" id="toggle-theme" data-tip="Switch between the light and dark theme">Theme</button>
      <button type="button" id="toggle-source" aria-pressed="false" data-tip="Show the model as text and edit it directly">
        Source
      </button>
      <button
        type="button"
        id="export-schema"
        data-tip="Download one JSON Schema per collection, with required fields, enums and defaults"
      >
        JSON Schema
      </button>
      <button
        type="button"
        id="export-validator"
        data-tip="Download MongoDB $jsonSchema validators, ready for createCollection"
      >
        Mongo validator
      </button>
      <button
        type="button"
        id="export-png"
        data-tip="Download the whole diagram as a PNG, at twice the size so the text stays sharp"
      >
        PNG
      </button>
      <button
        type="button"
        id="export-samples"
        data-tip="Download one example document per collection, to see the shape you would actually query"
      >
        Samples
      </button>
    </header>

    <main id="workspace" class="source-hidden">
      <section id="source-pane">
        <div id="gutter" aria-hidden="true"><div id="gutter-lines"></div></div>
        <div id="code">
          <div id="line-band" aria-hidden="true"></div>
          <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea
            id="source"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            wrap="off"
            aria-label="Model source"
          ></textarea>
        </div>
      </section>

      <section id="diagram-pane">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
        <ul id="diagnostics"></ul>
      </section>
    </main>

    <script type="module" src="dist/app/main.js"></script>
  </body>
</html>
