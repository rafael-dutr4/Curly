<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curly</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="brand">Curly</span>

      <button type="button" id="file-open" title="Open a .curly model from your computer">Open</button>
      <button type="button" id="file-save" title="Save the model back to its file, or choose where to put it">
        Save
      </button>
      <button type="button" id="load-example" title="Replace the model with one of the worked examples">
        Load example
      </button>

      <span class="spacer"></span>

      <button type="button" id="toggle-source" aria-pressed="false" title="Show the model as text and edit it directly">
        Source
      </button>
      <button
        type="button"
        id="export-schema"
        title="Download one JSON Schema per collection, with required fields, enums and defaults"
      >
        JSON Schema
      </button>
      <button
        type="button"
        id="export-validator"
        title="Download MongoDB $jsonSchema validators, ready for createCollection"
      >
        Mongo validator
      </button>
      <button
        type="button"
        id="export-samples"
        title="Download one example document per collection, to see the shape you would actually query"
      >
        Samples
      </button>
    </header>

    <main id="workspace" class="source-hidden">
      <section id="source-pane">
        <textarea id="source" spellcheck="false" autocomplete="off" aria-label="Model source"></textarea>
      </section>

      <section id="diagram-pane">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
        <ul id="diagnostics"></ul>
      </section>
    </main>

    <script type="module" src="dist/app/main.js"></script>
  </body>
</html>
